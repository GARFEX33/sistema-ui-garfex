  runner:
    command: ""
    framework: ""
  intended:
    package_manager: pnpm
    unit: "pnpm test"
    e2e: "pnpm exec playwright test"
    component: "pnpm exec vitest"
  layers:
    unit:
      available: false
      tool: "Vitest"
      note: "Planned; no package.json, source, or test files exist yet."
    component:
      available: false
      tool: "React Testing Library with Vitest"
      note: "Planned; no package.json, source, or test files exist yet."
