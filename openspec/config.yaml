schema: spec-driven

context: |
  Project: GARFEX ERP frontend with the Base mínima and Bandeja workstation slice implemented and archived. Product-visible language and SDD artifacts are Spanish; technical identifiers and code are English.
  Stack: React 19, TypeScript, Vite, TanStack Router/Form/Table/Virtual, React Aria Components, Tailwind CSS, Vitest, React Testing Library, Playwright, Storybook, ESLint, Prettier. Package manager: pnpm. Package scripts and test/build tooling are runnable.
  Architecture: Feature-first Scope Rule with Screaming Architecture; keep only minimal transversal shared infrastructure and avoid speculative abstractions. The external backend is authoritative. This frontend must not introduce a backend, persistence, invented domain rules, global stores, repositories, use cases, gateways, facades, or a Query state layer. The canonical model is Clase -> Familia -> Tipo -> Recurso: Familia.claseRecursoId references Clase, Tipo.familiaRecursoId references Familia, and Recurso.tipoRecursoId references Tipo.
  Current scope: the next change is the Catálogo maestro hierarchy base only: Clases, Familias and Tipos with navigation, creation and read behavior. Familia->Clase and Tipo->Familia are immutable; Recurso->Tipo is reclassifiable through a future controlled, auditable flow. Units, attribute definitions, assignments, rules, presentation, compatibility, publication, Resources implementation, responsive/mobile/touch-specific behavior and additional visual states are out of scope unless separately approved.
  Design evidence: approved OpenPencil artifacts and frozen snapshots remain visual authority, but every selector, breadcrumb and dependency must be audited against Clase -> Familia -> Tipo before implementation. Preserve design.op, design-recovered.op, recovery/, PNG evidence and docs; this SDD must not modify OpenPencil recovery artifacts.
  Quality: Strict TDD is required. Runnable pnpm commands include test, Storybook tests, Playwright E2E, build, lint, format check and typecheck. Target accessibility is WCAG 2.2 AA. Brand and UI decisions follow approved GARFEX design evidence and the canonical identity manual.
  SDD preflight: execution_mode=auto; artifact_store=openspec; delivery_strategy=ask-on-risk; review_budget_authored_lines=400; chain_strategy=deferred. No commit, branch, PR, remote or push authorization is inferred for the new change.
  Initialization state: OpenSpec is initialized and the previous bootstrap-operations-inbox change is archived. New changes must preserve canonical specs and unrelated recovery work.

strict_tdd: true

rules:
  proposal:
    require_problem_statement: true
    guidelines:
      - Keep the catalog hierarchy change limited to Clases, Familias and Tipos.
      - State explicit scope, non-goals, risks, backend-authoritative relations and rollback boundaries.
      - Treat approved OpenPencil designs as visual authority only after auditing them against Clase -> Familia -> Tipo.
  spec:
    require_acceptance_criteria: true
    guidelines:
      - Define observable behavior in Spanish product terms with Given/When/Then scenarios.
      - Do not invent backend contracts, persistence, permissions, domain rules, or unsupported responsive states.
      - Include keyboard and WCAG 2.2 AA behavior where relevant.
  design:
    require_tradeoffs: true
    guidelines:
      - Preserve feature-first Scope Rule and Screaming Architecture.
      - Keep shared infrastructure minimal and justify every transversal abstraction.
      - Record OpenPencil fidelity, accessibility, immutable catalog-parent relationships and workstation-only boundaries.
  tasks:
    protect_review_workload: true
    guidelines:
      - Order implementation as strict RED-GREEN-REFACTOR slices once tests and tooling exist.
      - Keep authored review workload within 400 lines or escalate under ask-on-risk.
  apply:
    tdd: true
    test_command: "pnpm test"
    guidelines:
      - Do not assume pnpm test is runnable until package.json and test tooling are added.
      - Preserve unrelated design and documentation files.
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
    guidelines:
      - Run and report the configured pnpm quality commands honestly.
      - Verify the implementation against the audited approved workstation design, backend hierarchy contracts and accessibility constraints.
  archive:
    - Preserve an auditable record of deviations, follow-up work, and unexecuted checks.

testing:
  detected: "2026-08-31"
  runner:
    command: "pnpm test"
    framework: "Vitest"
  intended:
    package_manager: pnpm
    unit: "pnpm test"
    e2e: "pnpm exec playwright test"
    component: "pnpm exec vitest"
  layers:
    unit:
      available: true
      tool: "Vitest"
      note: "Runnable with pnpm test."
    component:
      available: true
      tool: "React Testing Library with Vitest"
      note: "Runnable through the Vitest suite."
    e2e:
      available: true
      tool: "Playwright"
      note: "Runnable with pnpm test:e2e; Chromium was installed for the previous verified change."
  coverage:
    available: false
    note: "No dedicated coverage script is configured."
  quality:
    compiler_or_type_checker:
      available: true
      note: "Runnable with pnpm typecheck."
    linter:
      available: true
      tool: ESLint
      note: "Runnable with pnpm lint."
    formatter:
      available: true
      tool: Prettier
      note: "Runnable with pnpm format:check."
    build:
      available: true
      command: "pnpm build"
      note: "Runnable Vite production build."
